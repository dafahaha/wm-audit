name: cartpole-probe

# One-off feasibility probe for the optional dm_control extension path.
# Trigger: pushing to the throwaway branch ci/cartpole-probe (keeps main's CI
# untouched). Answers three questions before any locked-scale run:
#   1. does `pip install dm_control` build on a stock ubuntu-latest runner?
#   2. does headless rendering work via OSMesa (MUJOCO_GL=osmesa)?
#   3. what is the real per-step cost (render + step) on that runner?
# It then runs the whole audit battery at toy scale on cartpole_swingup and
# commits its own measurements to docs/cartpole_runner_probe.md, because the
# Actions logs are not readable without an authenticated token.

on:
  push:
    branches: [ci/cartpole-probe]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install light deps (CPU torch)
        run: |
          python -m pip install --upgrade pip 2>&1 | tee -a /tmp/probe_install.log
          pip install numpy pyyaml scipy 2>&1 | tail -3 | tee -a /tmp/probe_install.log
          pip install torch --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -3 | tee -a /tmp/probe_install.log

      - name: Install dm_control (MuJoCo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libglew-dev freeglut3-dev 2>&1 | tail -3 | tee -a /tmp/probe_install.log
          pip install dm_control 2>&1 | tail -6 | tee -a /tmp/probe_install.log
          python -c "import dm_control, mujoco; print('dm_control', getattr(dm_control,'__version__','?'), '| mujoco', mujoco.__version__)" 2>&1 | tee -a /tmp/probe_install.log

      - name: Render and step timing under OSMesa
        env:
          MUJOCO_GL: osmesa
        run: |
          python - <<'PY' 2>&1 | tee /tmp/probe_timing.log
          import time
          import numpy as np
          from wm_audit.envs.dmc import DMControlEnv

          env = DMControlEnv()
          obs = env.reset(seed=0)
          print("obs", obs.shape, obs.dtype, "mean=%.4f" % float(obs.mean()))
          n = 300
          t0 = time.perf_counter()
          for _ in range(n):
              obs, reward, done, info = env.step(np.zeros(env.action_dim))
              if done:
                  obs = env.reset(seed=0)
          dt = time.perf_counter() - t0
          print("PER_STEP %.1f ms/step" % (dt * 1000.0 / n))
          print("PER_CONFIG_100K collect -> %.1f min" % (dt * 100000.0 / n / 60.0))
          PY

      - name: End-to-end battery probe (cartpole, toy scale)
        env:
          MUJOCO_GL: osmesa
        run: |
          python -m experiments.run_audit --config configs/audit/cartpole_smoke.yaml --mode smoke --out /tmp/probe.json 2>&1 | tee /tmp/probe_battery.log
          python - <<'PY' 2>&1 | tee -a /tmp/probe_battery.log
          import json
          d = json.load(open("/tmp/probe.json"))
          print("ROWS", len(d.get("rows", [])))
          k = d["rows"][0]
          print("PIXEL_COMPOSITE", k.get("pixel_composite"), "R_REAL", k.get("R_real"))
          print("H1", d.get("H1", {}).get("supports_H1"), "H2", d.get("H2", {}).get("supports_H2"))
          PY

      - name: Record measurements in the repo
        run: |
          python - <<'PY'
          import datetime, json, pathlib, re
          root = pathlib.Path(".")
          def read(p):
              try:
                  return pathlib.Path(p).read_text(errors="replace")
              except FileNotFoundError:
                  return "(missing)"
          timing = read("/tmp/probe_timing.log")
          battery = read("/tmp/probe_battery.log")
          dmc = [l for l in read("/tmp/probe_install.log").splitlines() if l.startswith("dm_control")]
          ms = re.search(r"PER_STEP (\S+) ms/step", timing)
          cfg_min = re.search(r"PER_CONFIG_100K collect -> (\S+) min", timing)
          rows = re.search(r"ROWS (\d+)", battery)
          pc = re.search(r"PIXEL_COMPOSITE (\S+) R_REAL (\S+)", battery)
          md = [
              "# dm_control cartpole path on a stock GitHub runner",
              "",
              "Generated by `.github/workflows/cartpole-probe.yml` on branch "
              "`ci/cartpole-probe`; the file is written by the workflow itself so the "
              "measurement is not a hand-typed claim.",
              "",
              f"- run date (UTC): {datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M')}",
              f"- runner: `ubuntu-latest`, Python 3.11, CPU torch",
              f"- dm_control import: {dmc[0] if dmc else 'FAILED'}",
              f"- per-step (64x64 render + 2x frame skip, OSMesa): "
              f"{ms.group(1) if ms else 'n/a'} ms",
              f"- implied 100k collect steps, single process: "
              f"{cfg_min.group(1) if cfg_min else 'n/a'} min",
              f"- toy battery rows: {rows.group(1) if rows else 'n/a'}",
              f"- first row pixel_composite / R_real: "
              f"{pc.group(1) + ' / ' + pc.group(2) if pc else 'n/a'}",
              "",
              "## timing log",
              "",
              "```",
              timing.strip(),
              "```",
              "",
              "## battery log (tail)",
              "",
              "```",
              "\n".join(battery.strip().splitlines()[-12:]),
              "```",
              "",
          ]
          pathlib.Path("docs/cartpole_runner_probe.md").write_text("\n".join(md), encoding="utf-8")
          print("wrote docs/cartpole_runner_probe.md")
          PY
          git config user.name "wm-audit probe"
          git config user.email "probe@users.noreply.github.com"
          git add docs/cartpole_runner_probe.md
          git commit -m "docs: record the dm_control cartpole runner probe measurements" || echo "nothing to commit"
          git push
