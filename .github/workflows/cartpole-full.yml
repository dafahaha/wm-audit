name: cartpole-full

# Executes the preregistered SECOND-env MAIN grid (dm_control.cartpole_swingup,
# 200k steps x 5 seeds x 3 capacities) on GitHub-hosted runners, sharded by
# seed: five independent jobs, three capacities each with --jobs 3.
#
# Why here and not on the small Linux container: that host is recycled every
# ~50 min (three restarts observed: 21:02, 21:49:59, 22:56), so no single
# config (~2-3 h) can finish there. Runners have a 6 h per-job cap and no
# restarts. Feasibility was measured first -- see docs/cartpole_runner_probe.md.
#
# Results are committed back to this branch (a run's log is not reachable
# anonymously through the API, but a committed file is). Commits carry
# "[skip ci]" so they do not re-trigger this workflow.

on:
  push:
    branches: [ci/cartpole-full]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cartpole-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shard:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [0, 1, 2, 3, 4]
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System libraries for software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libosmesa6 libglew-dev freeglut3-dev libgl1

      - name: Install CPU torch, package and dm_control
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install "dm_control>=1.0.52"
          python - <<'PY'
          import mujoco, dm_control, torch
          print("mujoco", mujoco.__version__, "| torch", torch.__version__)
          PY

      - name: Run seed shard
        run: |
          mkdir -p leaderboard/ci
          python experiments/run_audit.py \
            --config configs/audit/main_cartpole_full.yaml \
            --mode main \
            --seeds "${{ matrix.seed }}" \
            --jobs 3 \
            --out "leaderboard/ci/cartpole_seed${{ matrix.seed }}.json"

      - name: Commit shard rows back to the branch
        if: always()
        run: |
          git config user.name "wm-audit-ci"
          git config user.email "wm-audit-ci@users.noreply.github.com"
          git add leaderboard/ci
          if git diff --cached --quiet; then
            echo "no rows produced"
            exit 0
          fi
          git commit -m "ci(cartpole): seed ${{ matrix.seed }} rows [skip ci]"
          n=0
          until git push origin "HEAD:${GITHUB_REF_NAME}"; do
            n=$((n+1))
            if [ "$n" -ge 8 ]; then echo "push failed after 8 attempts"; exit 1; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 5
          done
