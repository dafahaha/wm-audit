# Audit run configuration. The `smoke` block is what CI runs (CPU, minutes).
env: pixel_nav
diagnostics:
  - pixel_mse
  - pixel_ssim
  - pixel_nll
  - pixel_lpips
  - rollout_fvd
  - return_ece
  - counterfactual_tau
  - uncertainty_rho
  - uncertainty_ece
return_key: R_real

smoke:
  buffer_capacity: 4000
  collect_steps: 3000
  data_seed: 123
  ensemble_size: 2
  train_steps: 150
  batch_size: 64
  lr: 0.002
  calib_segments: 24
  calib_horizon: 8
  cf_pairs: 40
  cem_horizon: 6
  cem_candidates: 48
  cem_elites: 8
  cem_iters: 2
  capacities: [[16, 16], [32, 16], [32, 32]]   # hidden, embed: distinct small/med/large
  seeds: [0, 1]
  bootstrap_resamples: 200
  # Compression levers applied post-hoc to the trained float ensemble. Each lever
  # adds one extra row carrying compression=<lever> on the SAME (hidden,embed,seed)
  # triple, re-running the identical rollout battery (H3 assessability path).
  # smoke MUST list >=1 int8 lever so the H3 assessable branch runs end-to-end in CI.
  compression_levers: [int8]

main:
  # ==========================================================================
  # CPU REDUCED PILOT CONFIG (2026-10-13). Kept as the fast default so that
  # `--mode main` still reproduces the committed pilot in ~25-35 min.
  #
  # The LOCKED-SCALE run (200k train steps x 100k collect steps x 5 seeds x 3
  # capacities, single env pixel_nav) was executed 2026-11-07 via
  # configs/audit/main_pixel_nav_full.yaml with --jobs 4; its artifact is
  # leaderboard/results_main_pixelnav_200k.json (n=15 float rows). The second
  # locked env, dm_control.cartpole_swingup, was executed 2026-11-13 via
  # configs/audit/main_cartpole_full.yaml as five seed shards on GitHub-hosted
  # ubuntu-latest runners (artifact: leaderboard/results_main_cartpole_200k.json,
  # n=15 float rows; shard files under leaderboard/ci/). The locked 2-of-2 2-env
  # MAIN is therefore executed.
  #
  # dm_control does NOT install in the Windows venv: `pip install dm_control`
  # pulls `labmaze`, which has no cp3.13 wheel and requires `bazel` to build from
  # source (`error: command 'bazel' failed`). It also failed in this 8 GiB CPU
  # container, but NOT for lack of MuJoCo: a GitHub runner installs dm_control
  # 1.0.52 / mujoco 4.0.1 and renders through OSMesa at ~11.7 ms per 64x64 step
  # (docs/cartpole_runner_probe.md). The container's blocker was run length --
  # it is recycled every few minutes, so a 2-3 h config never finishes there.
  #
  # Deviations in THIS pilot config (all documented, none silent):
  #   * env: pixel_nav ONLY. The 2nd prereg env runs from its own config (see
  #     above); Atari/ale-py is out of prereg scope.
  #   * device: CPU (venv torch 2.14.1+cpu; cuda_available=False). A cu124
  #     install was attempted but pip keeps the already-satisfied CPU wheel;
  #     the models are sub-10k-param RSSMs (batch 64, 256-dim obs) so a GPU
  #     would be kernel-launch-bound anyway. Measured CPU throughput ~236
  #     member-steps/s -> the locked 200k steps x 5 seeds x 3 caps x 2 envs
  #     (~21 h) is out of session budget.
  #   * seeds 3 (prereg GOAL 5), train_steps 12000 (prereg 200000),
  #     collect_steps 8000 (prereg 100000). Capacities, bootstrap=2000 and the
  #     int8 lever are kept exactly as preregistered.
  # The stats machinery (float-only H1/H2, fixed-float-ladder H3, t-approx p +
  # Holm, percentile bootstrap) is the locked pipeline, run verbatim.
  # ==========================================================================
  buffer_capacity: 16000
  collect_steps: 8000
  data_seed: 123
  ensemble_size: 3
  train_steps: 12000
  batch_size: 64
  lr: 0.002
  calib_segments: 24
  calib_horizon: 8
  cf_pairs: 40
  cem_horizon: 6
  cem_candidates: 48
  cem_elites: 8
  cem_iters: 2
  capacities: [[16, 16], [32, 16], [32, 32]]   # hidden, embed: distinct small/med/large
  seeds: [0, 1, 2]
  bootstrap_resamples: 2000
  compression_levers: [int8]
