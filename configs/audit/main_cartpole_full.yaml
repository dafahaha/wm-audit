# Preregistered MAIN run, second env: dm_control.cartpole_swingup.
#
# The locked preregistration asks for 200k steps x 5 seeds x 3 capacities x 2 envs.
# This config executes the SECOND prereg env at the locked main scale, on a
# GitHub Actions ubuntu-latest runner (4 vCPU / 16 GB / no GPU) with
# MuJoCo 4.0.1 + dm_control under MUJOCO_GL=osmesa (software rendering).
#
# Measured on that runner before this config was used (docs/cartpole_runner_probe.md):
# 11.7 ms per env step including render, i.e. ~19.5 min for one 100k-step
# collection. The grid is sharded by seed across five independent jobs; each job
# runs 3 capacities with --jobs 3. Shards are concatenated in seed order before
# the H1/H2/H3 aggregation, so the grid is the preregistered one.
#
# Every parameter below is a preregistered value; nothing is reduced.
env: dm_control.cartpole_swingup
diagnostics:
  - pixel_mse
  - pixel_ssim
  - pixel_nll
  - pixel_lpips
  - rollout_fvd
  - return_ece
  - counterfactual_tau
  - uncertainty_rho
  - uncertainty_ece
return_key: R_real

main:
  buffer_capacity: 16000
  collect_steps: 100000
  data_seed: 123
  ensemble_size: 3
  train_steps: 200000
  batch_size: 64
  lr: 0.002
  calib_segments: 24
  calib_horizon: 8
  cf_pairs: 40
  cem_horizon: 6
  cem_candidates: 48
  cem_elites: 8
  cem_iters: 2
  capacities: [[16, 16], [32, 16], [32, 32]]
  seeds: [0, 1, 2, 3, 4]
  bootstrap_resamples: 2000
  compression_levers: [int8]
