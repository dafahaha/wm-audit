# Preregistered MAIN run, single-env subset (pixel_nav only).
#
# The locked preregistration asks for 200k steps x 5 seeds x 3 capacities x 2 envs.
# dm_control.cartpole_swingup is not available in this Linux CPU container
# (no MuJoCo/EGL); this config executes the OTHER prereg env, pixel_nav, at the
# locked main scale. It is an honest single-env subset, not the full 2-env main.
#
# Every parameter below is the preregistered value; nothing is reduced.
env: pixel_nav
diagnostics:
  - pixel_mse
  - pixel_ssim
  - pixel_nll
  - pixel_lpips
  - rollout_fvd
  - return_ece
  - counterfactual_tau
  - uncertainty_rho
  - uncertainty_ece
return_key: R_real

main:
  buffer_capacity: 16000
  collect_steps: 100000
  data_seed: 123
  ensemble_size: 3
  train_steps: 200000
  batch_size: 64
  lr: 0.002
  calib_segments: 24
  calib_horizon: 8
  cf_pairs: 40
  cem_horizon: 6
  cem_candidates: 48
  cem_elites: 8
  cem_iters: 2
  capacities: [[16, 16], [32, 16], [32, 32]]
  seeds: [0, 1, 2, 3, 4]
  bootstrap_resamples: 2000
  compression_levers: [int8]
