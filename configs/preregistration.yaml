# WM-Audit Preregistration
# Locked before running the main experiment. Do not tune thresholds after seeing
# results; deviations must be documented as deviations in the paper.
# Status: PREREGISTERED (MVP smoke). Main-experiment numbers are [IN PREPARATION].

study: "What You Imagine Is Not What You Get"
version: "v1-mvp"
locked: true
alpha: 0.05
correction: holm_bonferroni        # step-down, family = all reported diagnostics
ci: 0.95
bootstrap_resamples: 2000

# Sample size
sample_size:
  mvp_configs_per_arm: 3            # MVP smoke: tiny
  main_goal_seeds: 5                # main paper target
  main_goal_capacities: 3           # small / med / large
  main_goal_envs: 2                 # PixelNav (light) + dm_control.cartpole_swingup

# Composite diagnostics.
# The five pixel diagnostics have mixed units and mixed directions: mse / nll /
# lpips / fvd are error-type (lower = better fidelity), ssim is quality-type
# (higher = better). We combine them with a direction-unified rank composite:
#   1. within the configuration set, rank each diagnostic ascending (average
#      ranks for ties);
#   2. flip the rank of every error-type diagnostic so that a HIGHER rank always
#      means BETTER fidelity (ssim keeps ascending ranks);
#   3. composite = mean of the oriented ranks.
# The same recipe applies to the H2 control battery, where return_ece is the
# only error-type metric (flipped) and counterfactual_tau / uncertainty_rho are
# quality-type (ascending ranks). This recipe is implemented verbatim in
# wm_audit/diagnostics/fidelity_utility.py.
#
# H1/H2 POOL = FLOAT BASELINE ROWS ONLY. H1/H2 ask which diagnostics predict
# closed-loop return ACROSS MODEL CAPACITY. The compression-tagged rows (int8 /
# channel_prune / distill) are the SAME already-trained model under a deployment
# perturbation -- a near-duplicate of a float baseline, NOT a new capacity tier
# -- so they belong ONLY to the H3 paired test. The H1/H2 oriented-rank composite
# and every H1/H2 Spearman correlation (pixel_composite, control_composite, and
# the individual diagnostic columns) are therefore computed on
#   float_rows = [r for r in rows if not r['compression']]
# only. Compression rows are still displayed in the Rows table but never enter
# the H1/H2 correlation pool.

hypotheses:
  H1:
    question: "RQ1: Does pixel fidelity track closed-loop control utility?"
    diagnostic: "direction-unified rank composite of the 5 pixel diagnostics
                 (pixel_mse / pixel_ssim / pixel_nll / pixel_lpips / rollout_fvd)"
    composite_recipe: "oriented-rank mean (see Composite diagnostics note above);
                       ssim ascending, the other four rank-flipped."
    prediction: "weak correlation"
    threshold: 0.4                   # support H1 if |rho(pixel_composite, R_real)| < 0.4
    direction: null_result_tolerant

  H2:
    question: "RQ2: Which control-relevant diagnostics predict closed-loop utility?"
    diagnostics:
      - return_ece                  # imagined vs real return calibration
      - counterfactual_tau         # global pooled Kendall-tau-b over ALL (state,
                                   # action) triples: two candidate actions are
                                   # stepped in the oracle env and through the
                                   # model per state, then every (state, action)
                                   # reward pair is pooled into ONE series and a
                                   # single tie-aware Kendall-tau-b is computed.
                                   # NOT a per-state fraction of correct action
                                   # orderings (sign-agreement rate).
      - uncertainty_rho             # ensemble dispersion vs true error alignment
    composite_recipe: "same direction-unified rank composite as H1; return_ece
                       rank-flipped (lower = better), counterfactual_tau and
                       uncertainty_rho ascending."
    prediction: "strong correlation"
    threshold: 0.6                   # support H2 if rho(control_composite, R_real) > 0.6

  H3:
    question: "RQ3: How does compression change fidelity->utility?"
    levers: [int8, channel_prune, distill]
    prediction: "pixel fidelity degrades slowly; return calibration and uncertainty
                 alignment degrade faster under compression."
    assessability: "requires compression-tagged rows matched to float baselines by
                    the EXACT triple (hidden, embed, seed) -- same hidden AND same
                    embed AND same seed. Matching on (hidden, seed) alone is a
                    known mis-pairing: the capacity tiers
                    [[16,16],[32,16],[32,32]] put two different embeds on
                    hidden=32, so (hidden, seed) alone would silently pair the
                    int8 (hidden=32, embed=32) row with the wrong
                    (hidden=32, embed=16) float baseline. If several uncompressed
                    rows share the exact triple, the first in row order wins
                    (deterministic); there is NO fallback to a wider key -- a
                    compression row without an exact triple match is dropped.
                    Runs with NO compression rows at all (e.g. a config whose
                    compression_levers list is empty) report H3 = not_assessable;
                    we never fabricate the comparison."
    row_generation: "Compression variants are produced by the SAME pipeline that
                     trains the float baseline (wm_audit.audit.evaluate_config):
                     the float ensemble is trained once per (hidden, embed, seed),
                     then for every lever in cfg['compression_levers'] the lever
                     builder is applied post-hoc to EACH trained ensemble member
                     (int8 = wm_audit.deploy.quantize_dynamic_int8, dynamic
                     per-linear INT8; torch.ao deprecation warning suppressed,
                     not rewritten). The compressed member list then runs the
                     EXACT same rollout/diagnostic battery as the float members
                     (pixel, uncertainty, return calibration, counterfactual
                     tau, and closed-loop R_real), and is written as a second row
                     carrying the identical (hidden, embed, seed) triple plus
                     compression=<lever> (e.g. compression='int8'). The smoke
                     config carries compression_levers=[int8], so the smoke H3
                     path is assessable end-to-end; an empty list (e.g. the
                     not-yet-run main config) leaves H3 honestly not_assessable."
    operationalization: "Composites, not single metrics. Pixel side = the H1
                        pixel_composite; control side = the H2 control_composite
                        (return_ece flipped, counterfactual_tau and
                        uncertainty_rho ascending). CRITICAL: the rank scale is
                        FIXED to the float baseline set -- the capacity ladder
                        -- NOT to the float+compression union, so degradation
                        never drifts when another lever is added/removed:
                          (a) float_rows (no compression key) form the fixed
                              reference ladder;
                          (b) compute the oriented-rank composites ON float_rows
                              (rankdata, error-type flipped) -> one float
                              composite per baseline;
                          (c) for each compression row, INSERT each of its
                              diagnostic values into the fixed float reference
                              distribution and read its competition/insertion
                              rank on the SAME ladder:
                                  ins_asc(x) = #{s<x} + 0.5*#{s==x} + 0.5,
                              then flip for error-type diagnostics exactly as
                              the float ranks are flipped. This is deterministic
                              and self-consistent: a value tied to a float
                              reference reproduces that reference's own rank, so
                              a compressed row identical to its baseline scores
                              0.0 degradation; the inserted rank depends ONLY on
                              the fixed float ladder, never on how many other
                              compressed rows exist. Average the inserted ranks
                              into a compressed pixel composite and control
                              composite;
                          (d) match each compression row to its float baseline by
                              the EXACT (hidden, embed, seed) triple (first
                              float row in row order wins; no wider-key fallback);
                          (e) paired degradation = float_composite -
                              inserted_compressed_composite on each side (both
                              composites are 'higher is better', so a positive
                              value = a real degradation). Average over all
                              matched pairs. H3 supported iff mean
                              control-composite degradation strictly exceeds
                              mean pixel-composite degradation. No extra
                              post-hoc threshold; this is the locked directional
                              test. An invariance test pins this: two row sets
                              that differ ONLY in the number of compression
                              levers give the shared pair's pixel/control
                              degradation to the digit."

# Ensemble convention (applied identically to float and compressed rows).
# Pixel/uncertainty diagnostics average per-ensemble-member values across the
# ensemble. The control battery is now on the SAME footing: return_ece is computed
# per member on the identical matched segments and averaged, and
# counterfactual_tau is computed per member over the identical counterfactual
# states and averaged. Previously return_ece / counterfactual_tau silently used
# only members[0]; that asymmetry is removed (numbers recomputed honestly).

honesty:
  - "If H1 is falsified (pixel fidelity strongly predicts control), we still
     publish -- it is a bounded/null result."
  - "All thresholds, sample size, and correction are set here, before seeing data."
